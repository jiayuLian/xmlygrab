name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          brew install xcodegen ldid
          xcodegen --version
          ldid -h 2>&1 | head -3 || true

      - name: 生成工程
        run: xcodegen generate

      - name: 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || \
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: 编译（不签名）
        run: |
          set -e
          xcodebuild -project XmlyGrab.xcodeproj \
            -scheme XmlyGrab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 用 ldid 打私有 entitlements 并打包 IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          # 关键：TrollStore 会保留这里签进去的 entitlements。
          # 不签 = 没有 hid 派发权限 = 触摸注入无效。
          ldid -SXmlyGrab/XmlyGrab.entitlements "$APP/XmlyGrab"
          echo "--- 签名后 entitlements ---"
          ldid -e "$APP/XmlyGrab"
          rm -rf Payload XmlyGrab.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr XmlyGrab.ipa Payload
          ls -lh XmlyGrab.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: XmlyGrab-ipa
          path: XmlyGrab.ipa
          retention-days: 30

      - name: 发布 Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: XmlyGrab build ${{ github.run_number }}
          files: XmlyGrab.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
