name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: 安装工具
        run: |
          brew install xcodegen ldid || brew upgrade xcodegen ldid
          which xcodegen ldid || true

      - name: 生成工程
        run: xcodegen generate && ls -la XmlyGrab.xcodeproj

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild -project XmlyGrab.xcodeproj \
            -scheme XmlyGrab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee xcodebuild.log | tail -60

      - name: 失败时回显错误
        if: failure()
        run: |
          grep -nE "error:|error " xcodebuild.log | head -30 || true

      - name: ldid 打私有 entitlements 并打包 IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          test -n "$APP"
          # 关键：TrollStore 会保留这里签进去的 entitlements。
          # 不签 = 没有 hid 派发权限 = 触摸注入无效。
          ldid -SXmlyGrab/XmlyGrab.entitlements "$APP/XmlyGrab"
          echo "--- 签名后 entitlements ---"
          ldid -e "$APP/XmlyGrab"
          rm -rf Payload XmlyGrab.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry XmlyGrab.ipa Payload
          ls -lh XmlyGrab.ipa
          unzip -l XmlyGrab.ipa | head -12

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: XmlyGrab-ipa
          path: XmlyGrab.ipa
          retention-days: 30

      - name: 发布 Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: XmlyGrab build ${{ github.run_number }}
          files: XmlyGrab.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
